<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"> <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
    }

    .box {
      max-width: 520px;
      margin: auto;
      background: white;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    #reader {
      width: 100%;
      margin: 12px 0;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      font-size: 18px;
      border-radius: 10px;
      border: 1px solid #ccc;
      margin-top: 12px;
      text-transform: uppercase;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 17px;
      border: 0;
      border-radius: 10px;
      background: #176bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      background: #555;
    }

    .result {
      padding: 14px;
      border-radius: 12px;
      margin-top: 12px;
      font-size: 17px;
      line-height: 1.5;
      white-space: pre-line;
      word-wrap: break-word;
    }

    .ok {
      background: #e8f7ec;
      border: 1px solid #2eaf56;
      color: #176b32;
    }

    .warn {
      background: #fff7df;
      border: 1px solid #e0a800;
      color: #7a5600;
    }

    .bad {
      background: #fdecec;
      border: 1px solid #e04848;
      color: #9d1c1c;
    }

    .loading {
      background: #eaf2ff;
      border: 1px solid #4388e8;
      color: #174b91;
    }

    .small {
      font-size: 13px;
      color: #666;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Quét mã ưu đãi</h2>

    <div id="reader"></div>

    <button onclick="requestCameraAndStart()" id="btnStart">
      Bật / Xin quyền Camera
    </button>

    <button class="secondary" onclick="stopScan()">
      Dừng Camera
    </button>
